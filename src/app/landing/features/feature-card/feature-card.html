<article class="card">
  <div class="icon" aria-hidden="true">
    @if (icon === 'tasks') {
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M9 12.5l2 2 4-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="4" y="4" width="16" height="16" rx="5" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    }
    @if (icon === 'notes') {
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M7 4.5h7.5L19 9v10.5H7A1.5 1.5 0 0 1 5.5 18V6A1.5 1.5 0 0 1 7 4.5z" stroke="currentColor" stroke-width="1.6"/>
        <path d="M14.5 4.5V9H19M8.5 13h7M8.5 16.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    }
    @if (icon === 'finance') {
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 16.5l4.2-4.2 3.1 3.1L19 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14.5 8.5H19V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    }
    @if (icon === 'health') {
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 20s-6.5-4.3-8.2-8.2C2.4 8.7 4.2 6 7.1 6c1.6 0 3 .9 3.9 2.2C11.9 6.9 13.3 6 14.9 6c2.9 0 4.7 2.7 3.3 5.8C16.5 15.7 12 20 12 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    }
  </div>
  <h3>{{ title }}</h3>
  <p>{{ description }}</p>
</article>
